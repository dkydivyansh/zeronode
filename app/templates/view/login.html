<div id="custom-cursor-dot" class="pointer-events-none fixed top-0 left-0 w-1.5 h-1.5 bg-primary rounded-full z-[10000] transform -translate-x-1/2 -translate-y-1/2 will-change-transform"></div>

<script>
    const cursor = document.getElementById('custom-cursor');
    const cursorDot = document.getElementById('custom-cursor-dot');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        cursorDot.style.left = `${mouseX}px`;
        cursorDot.style.top = `${mouseY}px`;
    });
    
    function animateCursor() {
        cursorX += (mouseX - cursorX) * 0.12;
        cursorY += (mouseY - cursorY) * 0.12;
        cursor.style.left = `${cursorX}px`;
        cursor.style.top = `${cursorY}px`;
        requestAnimationFrame(animateCursor);
    }
    animateCursor();

    const interactives = document.querySelectorAll('button, a, .interactive-el');
    interactives.forEach(el => {
        el.addEventListener('mouseenter', () => {
            cursor.classList.add('scale-[2.5]', 'bg-primary/20', 'border-primary');
            cursor.classList.remove('border-primary/50');
        });
        el.addEventListener('mouseleave', () => {
            cursor.classList.remove('scale-[2.5]', 'bg-primary/20', 'border-primary');
            cursor.classList.add('border-primary/50');
        });
    });
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
    const scrambles = document.querySelectorAll('.scramble-text');
    scrambles.forEach(el => {
        let isScrambling = false;
        setInterval(() => {
            if (isScrambling || el.hasAttribute('data-transitioning')) return;
            const original = el.getAttribute('data-original');
            if (Math.random() < 0.15) {
                isScrambling = true;
                let scramblesCount = 0;
                const scrambleInterval = setInterval(() => {
                    el.innerText = original.split('').map(char => {
                        if (char.match(/[\s:\-{},"]/)) return char;
                        return Math.random() < 0.7 ? chars[Math.floor(Math.random() * chars.length)] : char;
                    }).join('');
                    scramblesCount++;
                    if (scramblesCount > 8) {
                        clearInterval(scrambleInterval);
                        el.innerText = original;
                        isScrambling = false;
                    }
                }, 40);
            }
        }, 100);
    });

    const generatePayload = () => {
        const payloads = [
            { session: "0x" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'), hash: "45TH", blocks: [Math.floor(Math.random()*10), Math.floor(Math.random()*10)], active: true },
            { token: btoa(Math.random().toString()).substr(0,8), cx: { ip: "192.168.1." + Math.floor(Math.random()*255), pt: [443, 80][Math.floor(Math.random()*2)] }, mode: "stealth" },
            { sys: "ZERONODE_V" + Math.floor(Math.random()*10), keys: [{"rsa":"comp"},{"aes":"sec"}], ts: Date.now() },
            { tgt: "alpha_node", drop: Math.floor(Math.random()*100), meta: {"reg":"us-east","lat": Math.floor(Math.random()*40) + "ms"} },
            { payload: "SECURE_HANDSHAKE", status: 200, sig: btoa(Math.random().toString()).substr(0,16) }
        ];
        return JSON.stringify(payloads[Math.floor(Math.random()*payloads.length)], null, 2);
    };

    setInterval(() => {
        const jsonBlocks = Array.from(scrambles).filter(el => {
            const txt = el.getAttribute('data-original');
            return txt && txt.includes('{') && !el.hasAttribute('data-transitioning');
        });
        
        if (jsonBlocks.length > 0) {
            const target = jsonBlocks[Math.floor(Math.random() * jsonBlocks.length)];
            const newJson = generatePayload();
            
            target.setAttribute('data-transitioning', 'true');
            const originalText = target.innerText;
            
            let wipes = 0;
            const wipeInterval = setInterval(() => {
                target.innerText = originalText.split('').map(char => {
                    if (char === '\n' || char === ' ') return char;
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                wipes++;
                if (wipes > 15) {
                    clearInterval(wipeInterval);
                    target.setAttribute('data-original', newJson);
                    target.innerText = newJson;
                    target.removeAttribute('data-transitioning');
                }
            }, 30);
        }
    }, 2000);
</script>
